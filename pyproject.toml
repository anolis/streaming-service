[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxcast"
version = "0.1.0"
description = "Windows-style 'Cast to device' for Linux: Chromecast now, Miracast/AirPlay pluggable"
requires-python = ">=3.10"
dependencies = ["pychromecast>=13"]

[project.scripts]
linuxcast = "linuxcast.cli:main"

[tool.setuptools.packages.find]
include = ["linuxcast*"]
